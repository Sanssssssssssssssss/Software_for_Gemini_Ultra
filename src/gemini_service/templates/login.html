{% extends "base.html" %}

{% block title %}登录 · Gemini Internal Service{% endblock %}

{% block body %}
  <section class="hero">
    <div>
      <div class="badge">内部服务入口</div>
      <h1>Gemini 内部共享服务</h1>
      <p>这是一个基于非官方 Gemini Web 封装构建的内部服务入口。登录后可选择账号、保持对话上下文，并查看账号池状态。</p>
    </div>
  </section>

  <section class="panel" style="max-width: 460px; margin: 28px auto 0; padding: 28px;">
    <h2 style="margin-top: 0;">UI 登录</h2>
    <p class="muted">使用内部 UI 凭据进入聊天界面和管理员页面。</p>
    {% if error %}
      <p class="danger" style="margin-top: 16px;">{{ error }}</p>
    {% endif %}
    <form method="post" action="/ui/login" style="display: grid; gap: 14px; margin-top: 18px;">
      <label>
        <div style="margin-bottom: 8px;">用户名</div>
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>
        <div style="margin-bottom: 8px;">密码</div>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">登录</button>
    </form>
  </section>
{% endblock %}
