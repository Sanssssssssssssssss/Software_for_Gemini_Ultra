[build-system]
requires = ["setuptools>=69", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-webapi"
authors = [
    {name = "UZQueen"},
]
description = "Gemini Web SDK fork with an internal multi-account service shell."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["API", "async", "Gemini", "Bard", "Google", "Generative AI", "LLM"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite~=0.21.0",
    "asyncpg~=0.30.0",
    "curl-cffi~=0.14.0",
    "fastapi~=0.116.0",
    "itsdangerous~=2.2.0",
    "jinja2~=3.1.6",
    "loguru~=0.7.3",
    "orjson~=3.11.7",
    "pydantic~=2.13.0",
    "pydantic-settings~=2.11.0",
    "python-multipart~=0.0.20",
    "sqlalchemy~=2.0.41",
    "uvicorn~=0.35.0",
]
dynamic = ["version"]

[project.optional-dependencies]
browser = ["browser-cookie3"]
dev = ["httpx~=0.28.0", "pytest~=8.4.0"]

[project.scripts]
gemini-service = "gemini_service.main:run"

[project.urls]
Repository = "https://github.com/Sanssssssssssssssss/Software_for_Gemini_Ultra"
Issues = "https://github.com/Sanssssssssssssssss/Software_for_Gemini_Ultra/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gemini_webapi", "gemini_webapi.*", "gemini_service", "gemini_service.*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
